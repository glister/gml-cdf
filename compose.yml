# Local development stack. Ports come from .env (${PORT_*}). Secrets are loaded
# into the dev container from .env.secrets (git-ignored).
#
#   docker compose up
#   pnpm migrate && pnpm seed   # from the host

# Project name comes from COMPOSE_PROJECT_NAME in .env (managed by
# `pnpm ports:sync`), so a worktree with a local .portPrefix override gets its own
# containers, network and volumes. This `name:` is only the fallback if that var
# is ever removed — COMPOSE_PROJECT_NAME takes precedence over it.
name: cdf

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Backing SQL store required by the Service Bus emulator.
  mssql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 15

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    restart: unless-stopped
    volumes:
      - ./docker/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      ACCEPT_EULA: 'Y'
    ports:
      - '${PORT_SERVICEBUS}:5672'
    depends_on:
      mssql:
        condition: service_healthy

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    restart: unless-stopped
    command: 'azurite-blob --blobHost 0.0.0.0 --blobPort 10000'
    ports:
      - '${PORT_AZURITE}:10000'
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 10000 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
        - '${PORT_MAILPIT_SMTP}:1025'
        - '${PORT_MAILPIT_UI}:8025'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8025']
      interval: 5s
      timeout: 5s
      retries: 10

  # HTML -> PDF rendering for the document engine (core plan 11 §4.6, Q1
  # resolved 2026-08-07). A separate service rather than headless Chromium in the
  # worker image: the worker stays small and boots fast, and a renderer crash is
  # a failed HTTP call the effect retries rather than a dead consumer. Stateless,
  # so no volume and nothing to back up.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    # Chromium only. The LibreOffice route would convert Office documents, which
    # this platform deliberately does not do — templates are HTML (§4.1).
    command:
      [
        'gotenberg',
        '--chromium-disable-javascript=true',
        '--chromium-allow-list=file:///tmp/.*',
      ]
    ports:
      - '${PORT_GOTENBERG}:3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 5s
      timeout: 5s
      retries: 10

  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: sh -c 'pnpm install && pnpm run dev'
    working_dir: /app
    env_file:
      - .env
      - .env.secrets
    environment:
      # Bind each app to its fixed container-internal port, not the host-published
      # PORT_* value from .env (which is only the external mapping in `ports:`
      # below). Without this the api binds PORT_API (17001) inside the container,
      # so host 17001->3001 and SSR's API_INTERNAL_URL (localhost:3001) hit nothing.
      PORT_WEB: 3000
      PORT_API: 3001
      PORT_WORKER: 3002
      # Point host-named services at their in-network names.
      POSTGRES_HOST: postgres
      # Postgres listens on its fixed container port in-network, not the
      # host-published POSTGRES_PORT (17010). @repo/db builds its pool from the
      # discrete POSTGRES_* vars, so this must be overridden alongside the host.
      POSTGRES_PORT: 5432
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      EMAIL_SMTP_HOST: mailpit
      # In-network Mailpit listens on its container port, not the host-published one.
      EMAIL_SMTP_PORT: 1025
      # Gotenberg in-network, on its fixed container port. Server-side only (the
      # worker renders), so this is deliberately the internal address.
      GOTENBERG_URL: 'http://gotenberg:3000'
      SERVICE_BUS_CONNECTION_STRING: 'Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;'
      AZURE_STORAGE_CONNECTION_STRING: 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;'
    ports:
      - '${PORT_WEB}:3000'
      - '${PORT_API}:3001'
      - '${PORT_WORKER}:3002'
    volumes:
      - .:/app
      # The whole repo is bind-mounted above, but the host (macOS) and container
      # (Linux) can't share a node_modules tree — native deps and pnpm's symlink
      # layout diverge. Each anonymous volume below shadows a workspace's
      # node_modules so the Linux container writes/reads its OWN copy instead of
      # reusing macOS-built modules from the bind mount. Root also holds pnpm's
      # `.pnpm` virtual store (symlinks into the CAS store from the named volume
      # below — that's a separate concern from these dirs). One entry per
      # workspace pnpm writes a real node_modules into.
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/mobile/node_modules
      - /app/apps/web/node_modules
      - /app/apps/worker/node_modules
      - /app/packages/cloud-storage/node_modules
      - /app/packages/db/node_modules
      - /app/packages/domain/node_modules
      - /app/packages/email/node_modules
      - /app/packages/env/node_modules
      - /app/packages/eslint-config/node_modules
      - /app/packages/logging/node_modules
      - /app/packages/service-bus/node_modules
      - /app/packages/sms/node_modules
      - /app/packages/trpc/node_modules
      - /app/packages/vitest-config/node_modules
      # pnpm's content-addressable store, on a container-owned named volume at the
      # absolute path pinned in Dockerfile.dev (`store-dir /pnpm/store`). Persists
      # across rebuilds and hard-links into the node_modules volumes above (same
      # container filesystem) instead of leaking a project-local .pnpm-store onto
      # the bind mount.
      - pnpm_store:/pnpm/store
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      servicebus-emulator:
        condition: service_started

  # Optional: uncomment to run HyperDX locally for OTel traces.
  # hyperdx:
  #   image: docker.hyperdx.io/hyperdx/hyperdx-local:latest
  #   ports:
  #     - '8080:8080'
  #     - '4318:4318'

volumes:
  pgdata:
  azurite_data:
  pnpm_store:
