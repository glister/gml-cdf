name: build-and-push

# Runs after Terraform succeeds on dev/prod (infra exists), or on manual dispatch.
# The workflow_run trigger is intentional and safe: it is gated to the dev/prod
# branches of THIS repo's terraform workflow (a fork PR cannot trigger it) and
# the job additionally guards on workflow_run.conclusion == 'success', so no
# untrusted code runs in this privileged context.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [terraform]
    types: [completed]
    branches: [dev, prod]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]

permissions:
  id-token: write # OIDC
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web, worker]
    env:
      PROJECT: cdf-connect
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve environment
        id: env
        # Pass context values through env (not inline ${{ }}) so an
        # attacker-influenceable branch name can't inject into the shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ENV: ${{ inputs.environment }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            name="$DISPATCH_ENV"
          else
            name="$RUN_BRANCH"
          fi
          # ACR names are alphanumeric-only: terraform builds this one as
          # replace("${project}${environment}acr", "-", ""), so the hyphen in
          # PROJECT must be stripped here too or the login target won't exist.
          {
            echo "name=$name"
            echo "acr=${PROJECT//-/}${name}acr"
            echo "rg=${PROJECT}-${name}-rg"
          } >> "$GITHUB_OUTPUT"

      - name: ACR login
        run: az acr login --name "${{ steps.env.outputs.acr }}"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.app }}.prod
          push: true
          tags: ${{ steps.env.outputs.acr }}.azurecr.io/${{ matrix.app }}:${{ github.sha }}

      - name: Update Container App
        run: |
          az containerapp update \
            --name "${PROJECT}-${{ steps.env.outputs.name }}-${{ matrix.app }}" \
            --resource-group "${{ steps.env.outputs.rg }}" \
            --image "${{ steps.env.outputs.acr }}.azurecr.io/${{ matrix.app }}:${{ github.sha }}"
