name: workflow-lint

on:
  pull_request:
    paths:
      - '.github/**'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check action pins (all third-party actions SHA-pinned)
        run: sh scripts/check-action-pins.sh

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: zizmor audit
        run: |
          python3 -m pip install --user zizmor
          "$(python3 -m site --user-base)/bin/zizmor" --min-severity=medium --offline .github/workflows
