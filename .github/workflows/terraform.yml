name: terraform

on:
  pull_request:
    paths:
      - 'terraform/**'
  push:
    branches: [dev, prod]
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        type: choice
        options: [dev, prod]

# Least privilege by default; only the deploy job opts into OIDC.
permissions:
  contents: read

jobs:
  # PR validation — format + validate only. Checking that the configuration is
  # well-formed needs neither cloud credentials nor the remote state backend, so
  # pull requests don't require Azure OIDC to be provisioned. Plan/apply against
  # real state happens in `deploy` on dev/prod pushes and manual dispatch.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  # Deploy — only on pushes to dev/prod or manual dispatch. Authenticates to
  # Azure via OIDC federated credentials and runs plan + apply against remote
  # state. Requires the AZURE_*/TF_STATE_*/TF_VAR_* repository secrets.
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC federated login to Azure
      contents: read
    defaults:
      run:
        working-directory: terraform
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
      TF_VAR_better_auth_secret: ${{ secrets.BETTER_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Resolve environment
        id: env
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ENV: ${{ inputs.environment }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            name="$DISPATCH_ENV"
          elif [ "$REF_NAME" = "prod" ]; then
            name="prod"
          else
            name="dev"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="key=${{ steps.env.outputs.name }}.tfstate"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -var-file="environments/${{ steps.env.outputs.name }}.tfvars" -out=tfplan

      - name: Apply
        run: terraform apply -auto-approve tfplan
